<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Ledger</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased pb-24">

    <div id="app" class="max-w-md mx-auto p-4 space-y-6">
        <header class="bg-gray-800 rounded-2xl p-5 shadow-xl border border-gray-700">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-bold tracking-tight">🔒 Secure Ledger</h1>
                <span id="syncStatus" class="text-xs bg-green-900 text-green-300 px-2 py-1 rounded-full font-mono">Ready</span>
            </div>
            <div class="space-y-3">
                <div>
                    <p class="text-xs text-gray-400 uppercase tracking-wider">Checking Balance</p>
                    <p id="checkingBalance" class="text-3xl font-bold text-emerald-400 font-mono">$0.00</p>
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-gray-700">
                    <div>
                        <p class="text-xs text-gray-400">Envelopes Total</p>
                        <p id="envelopesTotal" class="text-sm font-semibold font-mono text-gray-200">$0.00</p>
                    </div>
                    <div id="matchIndicator" class="text-xs px-2 py-1 rounded font-bold bg-emerald-950 text-emerald-400">✓ MATCH</div>
                </div>
            </div>
        </header>

        <nav class="grid grid-cols-3 gap-2">
            <button onclick="switchView('register')" class="nav-btn bg-emerald-600 text-white font-medium py-3 rounded-xl shadow-md text-sm">📝 Register</button>
            <button onclick="switchView('envelopes')" class="nav-btn bg-gray-800 text-gray-300 font-medium py-3 rounded-xl border border-gray-700 text-sm">📁 Envelopes</button>
            <button onclick="alert('Transaction Panel coming up!')" class="bg-indigo-600 text-white font-medium py-3 rounded-xl shadow-md text-sm font-bold">+ Transaction</button>
        </nav>

        <section id="registerView" class="space-y-3">
            <h2 class="text-lg font-semibold px-1">Recent Transactions</h2>
            <div id="transactionList" class="space-y-2"><p class="text-sm text-gray-500 text-center py-4">Enter PIN to view register.</p></div>
        </section>

        <section id="envelopesView" class="space-y-4 hidden">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-lg font-semibold">Your Envelopes</h2>
                <button onclick="alert('Transfer Tool coming up!')" class="text-xs bg-gray-700 text-indigo-300 px-3 py-1.5 rounded-lg border border-gray-600">⇄ Move Money</button>
            </div>
            <div id="envelopeList" class="grid grid-cols-1 gap-2"></div>
        </section>
    </div>

    <div id="lockScreen" class="fixed inset-0 bg-gray-950 flex flex-col justify-center items-center z-50 p-6">
        <div class="max-w-xs w-full text-center space-y-6">
            <h2 class="text-2xl font-bold">Enter Encryption PIN</h2>
            <p class="text-xs text-gray-400">This PIN decrypts your logs locally. It is never sent to Supabase.</p>
            <input type="password" id="pinInput" maxlength="6" readonly class="w-full text-center text-3xl font-mono tracking-widest bg-gray-900 border border-gray-700 rounded-xl py-3 text-white">
            <div class="grid grid-cols-3 gap-3">
                <script>
                    for(let i=1; i<=9; i++) {
                        document.write(`<button onclick="pressPin('${i}')" class="bg-gray-800 text-2xl font-mono font-bold py-4 rounded-xl border border-gray-700">${i}</button>`);
                    }
                </script>
                <button onclick="clearPin()" class="bg-red-950 text-red-400 text-sm font-bold py-4 rounded-xl border border-red-900">CLEAR</button>
                <button onclick="pressPin('0')" class="bg-gray-800 text-2xl font-mono font-bold py-4 rounded-xl border border-gray-700">0</button>
                <button onclick="submitPin()" class="bg-emerald-600 text-white text-sm font-bold py-4 rounded-xl shadow-lg">ENTER</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const SUPABASE_URL = 'https://rqojihfryxicnojxiphc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxb2ppaGZyeXhpY25vanhpcGhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MzY1NTAsImV4cCI6MjA5NTIxMjU1MH0.WLFTJ7ZzaZTkSlYzvsDr6mGA5IjZMxwSUfXfVOvZW6A';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let encryptionKey = null;

        // --- ENCRYPTION IMPLEMENTATION (AES-GCM) ---
        async function deriveKeyFromPin(pin) {
            const encoder = new TextEncoder();
            const salt = encoder.encode('UniquePersonalSaltInstance'); 
            const baseKey = await crypto.subtle.importKey('raw', encoder.encode(pin), { name: 'PBKDF2' }, false, ['deriveKey']);
            return await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
                baseKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
            );
        }

        async function encryptData(plaintext, key) {
            const encoder = new TextEncoder();
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, encoder.encode(plaintext));
            return JSON.stringify({
                iv: btoa(String.fromCharCode(...iv)),
                ciphertext: btoa(String.fromCharCode(...new Uint8Array(encrypted)))
            });
        }

        async function decryptData(encryptedJson, key) {
            try {
                const { iv, ciphertext } = JSON.parse(encryptedJson);
                const ivArray = new Uint8Array(atob(iv).split('').map(c => c.charCodeAt(0)));
                const ctArray = new Uint8Array(atob(ciphertext).split('').map(c => c.charCodeAt(0)));
                const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ivArray }, key, ctArray);
                return new TextDecoder().decode(decrypted);
            } catch (e) { return "[Decryption Error]"; }
        }

        // --- APPLICATION LOGIC ---
        let currentPin = "";
        function pressPin(num) { if(currentPin.length < 6) { currentPin += num; document.getElementById('pinInput').value = "*".repeat(currentPin.length); } }
        function clearPin() { currentPin = ""; document.getElementById('pinInput').value = ""; }
        
        async function submitPin() {
            if(currentPin.length < 4) return alert("PIN must be 4-6 digits");
            document.getElementById('syncStatus').innerText = "Unlocking...";
            encryptionKey = await deriveKeyFromPin(currentPin);
            document.getElementById('lockScreen').classList.add('hidden');
            document.getElementById('syncStatus').innerText = "Synced";
            // Data loading methods will run instantly here
        }

        function switchView(view) {
            document.getElementById('registerView').classList.toggle('hidden', view !== 'register');
            document.getElementById('envelopesView').classList.toggle('hidden', view !== 'envelopes');
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.replace('bg-emerald-600', 'bg-gray-800'));
            event.currentTarget.classList.replace('bg-gray-800', 'bg-emerald-600');
        }
    </script>
</body>
</html>
